name: Build zzuu (iOS 18 / TrollStore)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Native deps + app (free macOS runner)
    runs-on: macos-latest      # GitHub free macOS runner (Apple Silicon, latest Xcode)
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch sandbox sources (iSH fork)
        run: |
          rm -rf deps/ish deps/proot
          git clone --depth 1 https://github.com/OpenMinis/ish-arm64.git deps/ish
          echo "ish ready: $(ls deps/ish | head -3 | tr '\n' ' ')"

      - name: Toolchain check
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m
          sw_vers

      - name: Install Homebrew deps
        run: |
          brew install ninja llvm libarchive pkg-config lld || true
          # Homebrew split lld into its own formula (llvm no longer ships it).
          # Symlink into /usr/local/bin so -fuse-ld resolves by name everywhere.
          LLDBIN="$(brew --prefix lld 2>/dev/null)/bin"
          [ -d "$LLDBIN" ] || LLDBIN="$(brew --prefix llvm)/bin"
          sudo ln -sf "$LLDBIN/lld" /usr/local/bin/lld
          sudo ln -sf "$LLDBIN/ld.lld" /usr/local/bin/ld.lld
          sudo ln -sf "$LLDBIN/ld64.lld" /usr/local/bin/ld64.lld
          which lld && lld --version | head -1
          echo "PATH=$LLDBIN:$PATH" >> "$GITHUB_ENV"

      - name: Install Meson
        run: |
          pip3 install --break-system-packages meson 2>/dev/null || \
          pip3 install --user meson 2>/dev/null || \
          brew install meson || \
          pipx install meson
          meson --version || true

      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Ensure Go >= 1.25
        run: |
          go version || true
          if ! go version 2>/dev/null | grep -qE "go1\.(2[5-9]|[3-9][0-9])"; then
            echo "Installing Go 1.25..."
            ARCH=$(uname -m); [ "$ARCH" = "arm64" ] && GOARCH=darwin-arm64 || GOARCH=darwin-amd64
            curl -fsSL "https://go.dev/dl/go1.25.0.${GOARCH}.tar.gz" | sudo tar -xz -C /usr/local
          fi
          export PATH=/usr/local/go/bin:$PATH
          go version

      - name: Build LAME
        run: ./deps/build_lame.sh

      - name: Build FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        run: |
          # Patch the upstream VDSO meson rule: -fuse-ld=lld relies on clang
          # resolving lld by name, which fails when Homebrew llvm is keg-only
          # (clang's lookup skips /usr/local/bin). Replace with the absolute
          # path — clang's -fuse-ld= accepts one.
          sed -i '' "s|'-fuse-ld=lld'|'-fuse-ld=$(brew --prefix lld 2>/dev/null)/bin/ld.lld'|" deps/ish/vdso/arm64/meson.build
          grep -n "fuse-ld" deps/ish/vdso/arm64/meson.build
          ./deps/build_ish.sh

      - name: Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build rclone
        run: |
          export PATH=/usr/local/go/bin:$PATH
          ./deps/build_rclone_ios.sh

      - name: Prepare build-time customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Build app (unsigned, for TrollStore)
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Fake-sign with ldid (embed entitlements for TrollStore)
        run: |
          brew install ldid || true
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          if [ -z "$APP" ]; then
            echo "No .app found under build/DerivedData/Build/Products/Release-iphoneos" >&2
            exit 1
          fi
          # Determine CFBundleExecutable (preferred) or fall back to bundle name
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null) || EXEC=$(basename "$APP" .app)
          echo "Signing executable: $APP/$EXEC"
          if [ ! -f "$APP/$EXEC" ]; then
            echo "Executable not found: $APP/$EXEC" >&2
            ls -la "$APP" >&2
            exit 1
          fi
          # Sign the main binary with entitlements (CoreTrust accepts ldid's
          # fake signature; the entitlements blob is embedded and honored).
          ldid -Ssrc/ios/Minis.entitlements "$APP/$EXEC"
          # Sign embedded frameworks so dyld loads them
          find "$APP" -name "*.framework" -type d | while IFS= read -r fw; do
            BIN=$(basename "$fw" .framework)
            [ -f "$fw/$BIN" ] && ldid -S "$fw/$BIN"
          done
          find "$APP/PlugIns" -name "*.appex" -type d 2>/dev/null | while IFS= read -r ex; do
            BIN=$(basename "$ex" .appex)
            [ -f "$ex/$BIN" ] && ldid -S "$ex/$BIN"
          done
          # verify entitlements are embedded
          ldid -e "$APP/$EXEC" | head -25

      - name: Package .app
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Built: $APP"
          cp -R "$APP" zzuu.app
          tar czf zzuu-app.tar.gz zzuu.app
          ls -lh zzuu-app.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zzuu-app
          path: zzuu-app.tar.gz
